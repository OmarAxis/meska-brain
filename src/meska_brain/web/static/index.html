<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meska Brain: learning map</title>
<style>
/* Meska brand tokens. Articulat CF is the brand typeface; it is used when installed on the
   machine. It is not shipped here because it is a licensed font and this repository is public. */
:root {
  --blue: #2871F4;          /* Meska Blue: accents, selection, focus */
  --blue-strong: #1B5BD6;   /* same hue, dark enough for white text and for text on white */
  --blue-soft: #EAF1FE;
  --navy: #000038;
  --electric: #0000CE;
  --bg: #F5F7FB;
  --panel: #FFFFFF;
  --ink: #0A0A0A;
  --muted: #5B6478;
  --line: #E3E8F2;
  --line-strong: #C5CEDF;
  --accent: var(--blue-strong);
  --accent-ink: #FFFFFF;
  --focus: #B34700;
  --ok: #17643A;
  --ok-soft: #E6F4EC;
  --bad: #9C2B12;
  --bad-soft: #FBEEEA;
  --warn: #7A5F00;
  --strong-fill: #1B5BD6;
  --strong-ink: #FFFFFF;
  --shaky-fill: #F6E3A1;
  --shaky-line: #7A5F00;
  --gap-fill: #F5C9AE;
  --gap-line: #A63F00;
  --unseen-line: #7B8498;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(0, 0, 56, .05), 0 6px 20px rgba(0, 0, 56, .06);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  font: 15px/1.55 "Articulat CF", Inter, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  color: var(--ink); background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
button, select, input, textarea { font: inherit; color: inherit; }
button {
  cursor: pointer; border: 1px solid var(--line-strong); background: #fff; border-radius: var(--radius-sm);
  padding: 7px 14px; min-height: 38px; font-weight: 500;
  transition: background .12s ease, border-color .12s ease, box-shadow .12s ease;
}
button:hover { background: var(--bg); border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.primary:hover { background: #154BB6; border-color: #154BB6; }
button.danger { border-color: var(--bad); color: var(--bad); }
button.danger:hover { background: var(--bad-soft); }
button:disabled { opacity: .55; cursor: not-allowed; }
select, input[type=text], textarea {
  border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 7px 10px; background: #fff; min-height: 38px;
}
select:hover, input[type=text]:hover, textarea:hover { border-color: var(--muted); }
textarea { width: 100%; min-height: 76px; resize: vertical; }
label { font-weight: 600; font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; display: inline-block; margin-bottom: 3px; }
h1, h2, h3 { line-height: 1.2; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 24px; font-weight: 700; }
h3 { font-size: 16px; font-weight: 600; }
h2 + p { margin-top: 6px; max-width: 78ch; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Top bar: the brand gradient, white logo */
header.top {
  display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; justify-content: space-between;
  padding: 14px 28px; color: #fff;
  background: linear-gradient(135deg, #000038 0%, #000058 45%, #0000CE 100%);
}
.brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
.brand img { height: 24px; width: auto; display: block; margin: 6px 4px 6px 0; }
.brand .product { padding-left: 16px; border-left: 1px solid rgba(255, 255, 255, .28); }
.brand h1 { font-size: 18px; font-weight: 700; color: #fff; }
.brand .sub { font-size: 13px; color: rgba(255, 255, 255, .78); }
.who { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
.who label { color: rgba(255, 255, 255, .78); margin: 0; }
.who select { background: rgba(255, 255, 255, .1); color: #fff; border-color: rgba(255, 255, 255, .35); min-width: 190px; }
.who select:hover { border-color: #fff; }
.who select option { color: var(--ink); background: #fff; }
.who .note { font-size: 12px; color: rgba(255, 255, 255, .7); max-width: 250px; line-height: 1.35; }
header.top :focus-visible { outline-color: #fff; }

.layout { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 24px; padding: 24px 28px 40px; align-items: start; max-width: 1680px; margin: 0 auto; }
#rail { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
#rail h2 { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; padding: 4px 8px 10px; }
#rail ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
#rail button { width: 100%; text-align: left; border: 1px solid transparent; background: transparent; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; min-height: 40px; }
#rail button:hover { background: var(--bg); }
#rail button[aria-current=true] { background: var(--blue-soft); border-color: var(--blue); color: #0B2E7A; font-weight: 600; }
#rail .grade { color: var(--muted); font-size: 12px; white-space: nowrap; font-weight: 400; }

/* Section switcher: a segmented control */
nav.tabs { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; margin-bottom: 20px; background: #E9EDF5; border-radius: 14px; }
nav.tabs button { border: none; background: transparent; padding: 7px 16px; min-height: 36px; border-radius: 10px; color: var(--muted); font-weight: 500; }
nav.tabs button:hover { color: var(--ink); background: rgba(255, 255, 255, .6); }
nav.tabs button[aria-current=page] { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 56, .14); }
.badge { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 7px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; text-align: center; line-height: 20px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; }
.card + .card { margin-top: 14px; }
.row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.stack > * + * { margin-top: 10px; }
.err { color: var(--bad); font-weight: 600; }
.okmsg { display: inline-block; color: var(--ok); background: var(--ok-soft); font-weight: 600; padding: 6px 12px; border-radius: var(--radius-sm); margin-top: 8px; }
.empty { padding: 28px; color: var(--muted); text-align: center; }
.foot { margin: 32px 0 0; padding-top: 16px; border-top: 1px solid var(--line); max-width: 90ch; }

/* Map */
.map-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 24px; align-items: flex-end; margin-bottom: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; list-style: none; margin: 0; padding: 0; font-size: 13px; color: var(--muted); }
.legend li { display: flex; align-items: center; gap: 7px; }
.map-cols { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
.mapbox { overflow: auto; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); max-height: 72vh; }
.replay { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 14px; }
.replay input[type=range] { flex: 1 1 220px; min-width: 160px; min-height: 28px; accent-color: var(--blue); }
#detail { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }

svg text { font-family: inherit; }
.lane-bg { fill: #F8FAFD; }
.lane-bg.alt { fill: #FFFFFF; }
.lane-label { font-size: 12px; font-weight: 700; fill: #1C2333; }
.grade-label { font-size: 11px; font-weight: 700; fill: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.edge { fill: none; stroke: #9AA4B8; stroke-width: 1; opacity: .5; }
.edge.hl { stroke: #0A0A0A; stroke-width: 2; opacity: 1; }
.edge.tp { stroke: #A63F00; stroke-width: 3.5; opacity: 1; }
.tracing .edge:not(.tp) { opacity: .15; }
.node { cursor: pointer; }
.node rect.body { stroke-width: 1.5; }
.node text { font-size: 11px; pointer-events: none; }
.s-strong rect.body { fill: var(--strong-fill); stroke: #103C92; stroke-width: 2; }
.s-strong text { fill: var(--strong-ink); }
.s-shaky rect.body { fill: var(--shaky-fill); stroke: var(--shaky-line); stroke-width: 1.5; }
.s-shaky text { fill: #2F2500; }
.s-gap rect.body { fill: url(#hatch); stroke: var(--gap-line); stroke-width: 3; }
.s-gap text { fill: #3A1600; font-weight: 600; }
.s-unseen rect.body { fill: #fff; stroke: var(--unseen-line); stroke-width: 1.5; stroke-dasharray: 3 3; }
.s-unseen text { fill: var(--muted); }
.node:not(.s-strong) .m-strong, .node:not(.s-shaky) .m-shaky, .node:not(.s-gap) .m-gap, .node:not(.s-unseen) .m-unseen { display: none; }
.m-strong { fill: #fff; }
.m-shaky { fill: #7A5F00; }
.m-gap { fill: #A63F00; }
.m-unseen { fill: none; stroke: var(--unseen-line); stroke-width: 1.5; stroke-dasharray: 2 2; }
.ring { display: none; fill: none; }
.node.selected .ring.sel { display: block; stroke: #0A0A0A; stroke-width: 3; }
.node.on-path .ring.path { display: block; stroke: #A63F00; stroke-width: 3; }
.node.is-root .ring.path { stroke-width: 5; }
.node .tag { display: none; font-size: 10px; font-weight: 700; }
.node.is-root .tag.root, .node.is-unknown .tag.unk { display: block; fill: #0A0A0A; }
.tracing .node:not(.on-path):not(.is-unknown):not(.selected) { opacity: .4; }
.node:focus-visible rect.body { stroke: var(--focus); stroke-width: 4; }

.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; border: 1px solid transparent; font-size: 12px; font-weight: 600; background: var(--blue-soft); color: #0B2E7A; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.plain { background: var(--bg); color: var(--muted); border-color: var(--line); }
dl.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; font-size: 13px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; }

table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; background: #F8FAFD; white-space: nowrap; }
tbody tr:hover td { background: #FAFBFE; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); }
.tablewrap tr:last-child td { border-bottom: none; }
td.words { min-width: 160px; }
pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; background: #F5F7FB; border: 1px solid var(--line); padding: 10px; border-radius: var(--radius-sm); max-height: 240px; overflow: auto; }
details > summary { cursor: pointer; padding: 6px 0; font-weight: 600; color: var(--accent); }
details[open] > summary { margin-bottom: 6px; }
.finding .statement, .note-text { font-size: 17px; line-height: 1.5; margin: 10px 0; max-width: 80ch; }
.finding .controls { display: grid; gap: 10px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.rtl { direction: rtl; text-align: right; }
.steps li { margin: 3px 0; }
.status-running { color: var(--warn); font-weight: 700; }
.status-waiting_for_teacher { color: var(--accent); font-weight: 700; }
.status-done { color: var(--ok); font-weight: 700; }
.status-failed { color: var(--bad); font-weight: 700; }
.section-title { margin: 22px 0 10px; }

@media (max-width: 1100px) {
  .map-cols { grid-template-columns: 1fr; }
  #detail { position: static; max-height: none; }
}
@media (max-width: 800px) {
  .layout { grid-template-columns: 1fr; padding: 16px; gap: 16px; }
  #rail { position: static; max-height: 220px; }
  header.top { padding: 12px 16px; }
  .brand .sub { display: none; }
  h2 { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* ---- App shell: side navigation in the brand gradient ---- */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; overflow: auto; display: flex; flex-direction: column; gap: 22px;
  padding: 22px 16px; color: #fff; background: linear-gradient(170deg, #000038 0%, #000058 55%, #0000A8 100%);
}
.side .brand { display: block; padding: 2px 8px 0; }
.side .brand img { height: 26px; width: auto; display: block; margin: 0 0 10px; }
.side .brand h1 { font-size: 15px; font-weight: 600; color: #fff; letter-spacing: .02em; }
.side .brand .sub { font-size: 12px; color: rgba(255, 255, 255, .66); margin-top: 2px; line-height: 1.4; }
#nav { display: grid; gap: 4px; }
#nav button {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; min-height: 42px; padding: 8px 12px;
  border: 1px solid transparent; border-radius: 12px; background: transparent; color: rgba(255, 255, 255, .78); font-weight: 500;
}
#nav button svg { flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
#nav button:hover { background: rgba(255, 255, 255, .08); color: #fff; }
#nav button[aria-current=page] { background: rgba(255, 255, 255, .14); border-color: rgba(255, 255, 255, .2); color: #fff; font-weight: 600; }
#nav .badge { margin-left: auto; background: #fff; color: var(--blue-strong); }
.side .who { margin-top: auto; display: grid; gap: 6px; padding: 14px 12px; border-radius: 14px; background: rgba(255, 255, 255, .07); border: 1px solid rgba(255, 255, 255, .12); }
.side .who label { color: rgba(255, 255, 255, .7); margin: 0; }
.side .who select { width: 100%; min-width: 0; background: rgba(255, 255, 255, .1); color: #fff; border-color: rgba(255, 255, 255, .3); }
.side .who select option { color: var(--ink); background: #fff; }
.side .who .note { font-size: 12px; color: rgba(255, 255, 255, .62); line-height: 1.4; max-width: none; }
.side :focus-visible { outline-color: #fff; }
main.content { padding: 28px 36px 48px; min-width: 0; max-width: 1500px; }

.learnerbar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 20px; margin-bottom: 22px; }
.learnerbar nav.tabs { margin-bottom: 0; }
.pickwrap { display: grid; }
.pickwrap select { min-width: 230px; font-weight: 600; }
.learner-view h2 { font-size: 22px; }

.pagehead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px 24px; margin-bottom: 20px; }
.pagehead h2 { font-size: 28px; }
.pagehead p { margin: 6px 0 0; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 16px; }
.tile { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; min-height: 0; display: block; font-weight: 400; }
button.tile:hover { border-color: var(--blue); background: #fff; }
.tile-label { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.tile-value { font-size: 32px; font-weight: 700; line-height: 1.15; margin-top: 6px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.tile-note { font-size: 13px; color: var(--muted); margin-top: 2px; }
.tile.accent { background: linear-gradient(135deg, #000058 0%, #0000CE 100%); border-color: transparent; color: #fff; }
.tile.accent .tile-label, .tile.accent .tile-note { color: rgba(255, 255, 255, .8); }
button.tile.accent:hover { background: linear-gradient(135deg, #000070 0%, #1414E0 100%); }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; align-items: start; }
.grid2.wide-left { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); }
.grid2 > .card + .card { margin-top: 0; }
main.content > #view > .card { margin-bottom: 16px; }
.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; margin-bottom: 4px; }
.card-head button { min-height: 32px; padding: 4px 12px; font-size: 13px; }
.card-head + p { margin: 0 0 12px; }

.waitlist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 10px; }
.waitlist li { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: #FAFBFE; }
.wait-text { margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

svg.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .base { stroke: var(--line-strong); stroke-width: 1; }
.chart .axis { font-size: 11px; fill: var(--muted); }
.chart .bar { fill: var(--blue); }
.chart .bar:hover { fill: var(--blue-strong); }
.chart .band { fill: #EAF1FE; opacity: .7; }
.chart .line { fill: none; stroke: var(--blue); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { fill: var(--blue); stroke: #fff; stroke-width: 2; }
.chart .dot:hover { fill: var(--navy); }
.chart .endlabel { font-size: 12px; font-weight: 600; fill: var(--ink); }
.tip { position: fixed; z-index: 50; pointer-events: none; background: #0A0A2E; color: #fff; font-size: 12px; padding: 6px 10px; border-radius: 8px; max-width: 320px; box-shadow: 0 6px 20px rgba(0, 0, 56, .25); }

.sparks { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.spark { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px 6px; background: #fff; }
.spark-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.spark-subject, .heat-subject { display: block; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

table.heat { font-size: 13px; }
table.heat th, table.heat td { border-bottom: none; padding: 3px 4px; background: transparent; }
table.heat thead th { text-align: center; }
table.heat tbody th { text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--ink); font-weight: 500; white-space: normal; min-width: 150px; }
.heat-cell { display: block; text-align: center; padding: 9px 4px; border-radius: 8px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 58px; }
.heat-cell.none { background: transparent; border: 1px dashed var(--line-strong); color: var(--muted); font-weight: 400; font-size: 11px; padding: 10px 2px; }
.heat-key { display: flex; align-items: center; gap: 4px; margin-top: 10px; }
.heat-key span:first-child { margin-right: 4px; }
.heat-key span:last-child { margin-left: 4px; }
.heat-swatch { width: 22px; height: 10px; border-radius: 3px; }
.tablewrap.plain { border: none; }
table.heat tbody tr:hover td { background: transparent; }

.hbars { display: grid; gap: 8px; margin-top: 8px; }
.hbar { display: grid; grid-template-columns: minmax(120px, 42%) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13px; }
.hbar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar-track { height: 10px; border-radius: 5px; background: #EEF2F8; overflow: hidden; display: flex; gap: 2px; }
.hbar-fill { display: block; height: 100%; background: var(--blue); border-radius: 5px; }
.hbar-fill.rest { background: #B9C2D4; }
.hbar-num { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.keyline { display: flex; align-items: center; gap: 6px; margin-top: 12px; }
.key { width: 12px; height: 10px; border-radius: 3px; display: inline-block; }
.key.a { background: var(--blue); }
.key.b { background: #B9C2D4; margin-left: 12px; }

.numcol { font-variant-numeric: tabular-nums; }
button.linkish { border: none; background: transparent; padding: 0; min-height: 0; color: var(--accent); font-weight: 600; white-space: nowrap; text-align: left; }
button.linkish:hover { text-decoration: underline; background: transparent; }

.feed { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 2px; }
.feed li { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.feed li:last-child { border-bottom: none; }
.feed code { font: 12px ui-monospace, "Cascadia Mono", Consolas, monospace; background: var(--bg); padding: 2px 7px; border-radius: 6px; }
.feed-time { margin-left: auto; }
.dotmark { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.dotmark.bad { background: var(--bad); }

.patlist { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.patlist li { padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: #FAFBFE; }

.terms { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 12px; }
.term { flex: 0 0 200px; border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; background: #fff; }
.term-head { display: flex; justify-content: space-between; align-items: baseline; }
.term-abs { font-size: 12px; color: var(--muted); margin: 4px 0 8px; }
.term-abs.high { display: inline-block; color: #7A2E00; background: #FBE6D8; padding: 1px 8px; border-radius: 999px; font-weight: 600; }
.term ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.term li { display: grid; line-height: 1.3; }

.kg-edge { fill: none; opacity: .35; stroke-linecap: round; }
.kg-node circle { stroke: #fff; stroke-width: 2.5; }
.kg-node:hover circle { stroke: var(--ink); }
.kg-label { font-size: 13px; font-weight: 600; fill: var(--ink); }
.kg-sub { font-size: 11.5px; fill: var(--muted); }
.kg-centre { fill: var(--navy); stroke: #fff; stroke-width: 4; }
.kg-centre-text { fill: #fff; font-size: 20px; font-weight: 700; }
.kg-legend { margin-bottom: 4px; }
.kg-key { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.nextstep { margin: 10px 0; padding: 10px 14px; border-radius: var(--radius-sm); background: var(--blue-soft); display: grid; gap: 2px; }
.nextstep strong { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: #0B2E7A; }
.qlist { display: grid; gap: 4px; margin: 8px 0 16px; }
.qrow { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.seg { display: inline-flex; gap: 3px; padding: 3px; background: #E9EDF5; border-radius: 12px; }
.seg button { border: none; background: transparent; min-height: 32px; padding: 4px 14px; border-radius: 9px; color: var(--muted); }
.seg button[aria-checked=true] { background: var(--accent); color: #fff; font-weight: 600; }
.qfields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
.qfields input, .card textarea { width: 100%; }
@media (max-width: 1100px) { .grid2, .grid2.wide-left { grid-template-columns: 1fr; } }
@media (max-width: 800px) {
  .app { grid-template-columns: 1fr; }
  .side { position: static; height: auto; padding: 14px 16px; gap: 12px; }
  #nav { display: flex; flex-wrap: wrap; gap: 4px; }
  #nav button { width: auto; min-height: 38px; padding: 6px 10px; gap: 8px; }
  #nav .badge { margin-left: 2px; }
  .app > *, main.content > *, .grid2 > *, .card, .card > * { min-width: 0; }
  #nav button span:not(.badge) { white-space: nowrap; }
  main.content { padding: 18px 16px 36px; }
  .pagehead h2 { font-size: 22px; }
}

<body>
<div class="app">
  <aside class="side" aria-label="Meska Brain">
    <div class="brand">
      <img src="/static/brand/meska-white.png" alt="meska.Ai" width="148" height="26">
      <h1>Meska Brain</h1>
      <div class="sub">A cited learning map. The teacher decides.</div>
    </div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="who">
      <label for="teacher">Signed in as</label>
      <select id="teacher"><option value="">Choose your name</option></select>
      <span class="note">No password in this demo. It records who made each decision.</span>
    </div>
  </aside>

  <main class="content">
    <div class="learnerbar" id="tabs" hidden></div>
    <div id="view"></div>
    <p class="small muted foot">
      Learners appear by alias only. Nothing on this page ranks or compares learners. Every finding shows the records it rests on.
    </p>
  </main>
</div>
<div id="tip" class="tip" role="tooltip" hidden></div>

<script>
"use strict";

// ---------------------------------------------------------------- helpers
const SVGNS = "http://www.w3.org/2000/svg";

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  fill(el, props, kids);
  return el;
}
function s(tag, props, ...kids) {
  const el = document.createElementNS(SVGNS, tag);
  fill(el, props, kids);
  return el;
}
function fill(el, props, kids) {
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "text") el.textContent = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.setAttribute("class", v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
}
function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); return el; }

async function api(path, opts) {
  let res;
  try {
    res = await fetch(path, opts);
  } catch (e) {
    throw new Error("Could not reach the Meska Brain server. Is it still running?");
  }
  let body = null;
  try { body = await res.json(); } catch (e) { /* not json */ }
  if (!res.ok) {
    const msg = body && (body.error || (body.detail && JSON.stringify(body.detail))) || ("Request failed (" + res.status + ")");
    const err = new Error(msg);
    err.status = res.status;
    throw err;
  }
  return body;
}
function post(path, data) {
  return api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
}
function store(key, value) {
  try { if (value === undefined) return localStorage.getItem(key); localStorage.setItem(key, value); } catch (e) { return null; }
  return null;
}

const LANGS = { en: "English", ar: "Arabic", sw: "Swahili", fr: "French", am: "Amharic", ha: "Hausa", yo: "Yoruba", so: "Somali", fa: "Persian", ur: "Urdu", he: "Hebrew" };
const RTL = new Set(["ar", "fa", "ur", "he"]);
const langName = (c) => LANGS[c] || c;
const pct = (x) => (x === null || x === undefined ? "n/a" : Math.round(x * 100) + "%");
function confWords(c) {
  if (c === null || c === undefined) return "Confidence not stated";
  if (c < 0.35) return "Low confidence: treat as a question to check";
  if (c < 0.65) return "Medium confidence";
  return "Higher confidence";
}
const KIND = { root_cause: "Where it may have started", strength: "A strength pattern", struggle: "A struggle pattern", what_worked: "What seems to have helped" };
const KIND_EV = { quiz_item: "Quiz item", assignment: "Assignment", project: "Project", observation: "Teacher note", attendance: "Attendance" };
const STATE_WORDS = {
  strong: "Scores mostly secure so far",
  shaky: "Still forming: mixed scores",
  gap: "Low scores so far",
  unseen: "No records yet"
};

const state = {
  learners: [], teachers: [], learnerId: null, view: "overview", sub: "profile",
  graphs: {}, labels: {}, pendingCount: 0,
  sel: null, trace: null, periodIdx: 0, timer: null, runTimer: null, runId: null,
};
const aliasOf = (id) => (state.learners.find((l) => l.learner_id === id) || {}).alias || id;
const labelOf = (id) => state.labels[id] || (id || "").replace(/-/g, " ");

async function getGraph(lid) {
  if (!state.graphs[lid]) {
    state.graphs[lid] = await api("/api/learners/" + encodeURIComponent(lid) + "/graph");
    for (const n of state.graphs[lid].nodes) state.labels[n.id] = n.label;
  }
  return state.graphs[lid];
}
function teacherId() { return document.getElementById("teacher").value; }
function stopTimers() {
  if (state.timer) { clearInterval(state.timer); state.timer = null; }
  if (state.runTimer) { clearInterval(state.runTimer); state.runTimer = null; }
}

// ---------------------------------------------------------------- evidence table
const EVIDENCE_FIRST = 12;
function evidenceTable(rows) {
  if (!rows || !rows.length) return h("p", { class: "muted", text: "No records." });
  const row = (r) => {
    const words = r.raw_text
      ? h("span", { lang: r.language || "en", dir: "auto", text: r.raw_text })
      : h("span", { class: "muted", text: r.kind === "attendance" ? (r.absent_days + " day(s) absent") : "no words recorded" });
    return h("tr", {},
      h("td", { text: db_period(r) }),
      h("td", { text: KIND_EV[r.kind] || r.kind }),
      h("td", { text: r.concept_id ? labelOf(r.concept_id) : "" }),
      h("td", { text: r.score === null || r.score === undefined ? "" : pct(r.score) }),
      h("td", { class: "words" }, words, r.language && r.language !== "en" ? h("span", { class: "muted small", text: " (" + langName(r.language) + ")" }) : null),
      h("td", { text: r.source_ref }),
      h("td", { class: "small muted", text: r.id + (r.status === "needs_review" ? " (needs review)" : "") }));
  };
  // Long lists start short, so the decision buttons under them stay within reach.
  const tbody = h("tbody", {}, rows.slice(0, EVIDENCE_FIRST).map(row));
  const wrap = h("div", { class: "tablewrap" }, h("table", {},
    h("thead", {}, h("tr", {}, ["Period", "Type", "Concept", "Score", "Teacher's words", "Source", "Record"].map((t) => h("th", { scope: "col", text: t })))),
    tbody));
  if (rows.length <= EVIDENCE_FIRST) return wrap;
  const more = h("button", { type: "button", text: "Show all " + rows.length + " records" });
  more.onclick = () => { tbody.append(...rows.slice(EVIDENCE_FIRST).map(row)); more.remove(); };
  return h("div", {}, wrap, h("p", { class: "small muted", text: "Showing the first " + EVIDENCE_FIRST + " of " + rows.length + " records." }), more);
}
function db_period(r) { return r.year + "-T" + r.term; }

// ---------------------------------------------------------------- navigation
const NAV = [
  ["overview", "Class overview", "M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"],
  ["learner", "Learners", "M12 12a4 4 0 100-8 4 4 0 000 8zM4 20c0-4 4-6 8-6s8 2 8 6"],
  ["teaching", "My teaching", "M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3zM5 17a3 3 0 013-3h11"],
  ["review", "Review queue", "M10 6h10M10 12h10M10 18h10M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"],
  ["agent", "Agent", "M12 3v4M12 17v4M3 12h4M17 12h4M6 6l3 3M15 15l3 3M18 6l-3 3M9 15l-3 3"],
  ["audit", "Audit log", "M6 3h9l4 4v14H6zM9 12h7M9 16h7M9 8h3"],
];
const SUB = [["profile", "Profile"], ["map", "Learning map"], ["patterns", "Patterns"], ["approved", "Approved"]];

async function init() {
  try {
    const [l, t] = await Promise.all([api("/api/learners"), api("/api/teachers")]);
    state.learners = l.learners;
    state.teachers = t.teachers;
  } catch (e) {
    document.getElementById("view").append(h("p", { class: "err", text: e.message }));
    return;
  }
  const sel = document.getElementById("teacher");
  for (const t of state.teachers) sel.append(h("option", { value: t.id, text: t.name }));
  const saved = store("meska.teacher");
  if (saved && state.teachers.some((t) => t.id === saved)) sel.value = saved;
  sel.addEventListener("change", () => store("meska.teacher", sel.value));
  const savedLearner = store("meska.learner");
  const first = state.learners.find((l) => l.learner_id === savedLearner) || state.learners[0];
  if (first) state.learnerId = first.learner_id;
  refreshPending();
  show(location.hash.slice(1) || "overview");
}

function pickLearner(id, sub) {
  state.learnerId = id;
  store("meska.learner", id);
  state.sel = null; state.trace = null;
  show("learner/" + (sub || state.sub));
}

function drawTabs() {
  const nav = clear(document.getElementById("nav"));
  for (const [id, name, icon] of NAV) {
    nav.append(h("button", { type: "button", "aria-current": id === state.view ? "page" : "false", onclick: () => show(id) },
      s("svg", { viewBox: "0 0 24 24", width: 18, height: 18, "aria-hidden": "true" }, s("path", { d: icon })),
      h("span", { text: name }),
      id === "review" && state.pendingCount ? h("span", { class: "badge", text: state.pendingCount, "aria-label": state.pendingCount + " waiting" }) : null));
  }
  const bar = clear(document.getElementById("tabs"));
  bar.hidden = state.view !== "learner";
  if (bar.hidden) return;
  const pick = h("select", { id: "learner-pick", "aria-label": "Learner" },
    state.learners.map((l) => h("option", { value: l.learner_id, selected: l.learner_id === state.learnerId, text: l.alias + "  ·  Grade " + l.grade_now })));
  pick.addEventListener("change", () => pickLearner(pick.value));
  const tabs = h("nav", { class: "tabs", "aria-label": "Learner sections" },
    SUB.map(([id, name]) => h("button", { type: "button", "aria-current": id === state.sub ? "page" : "false", onclick: () => show("learner/" + id) }, name)));
  bar.append(h("div", { class: "pickwrap" }, h("label", { for: "learner-pick", text: "Learner" }), pick), tabs);
}
async function refreshPending() {
  try {
    const p = await api("/api/review/pending");
    state.pendingCount = p.findings.length + p.summaries.length;
    drawTabs();
  } catch (e) { /* the badge is a convenience */ }
}
function show(view) {
  stopTimers();
  let [v, sub] = String(view || "").split("/");
  if (SUB.some((t) => t[0] === v)) { sub = v; v = "learner"; }          // old links such as #map
  state.view = NAV.some((t) => t[0] === v) ? v : "overview";
  if (state.view === "learner") state.sub = SUB.some((t) => t[0] === sub) ? sub : (state.sub || "profile");
  history.replaceState(null, "", "#" + (state.view === "learner" ? "learner/" + state.sub : state.view));
  drawTabs();
  const root = clear(document.getElementById("view"));
  root.className = state.view === "learner" ? "learner-view" : "";
  const fn = state.view === "learner"
    ? { profile: viewProfile, map: viewMap, patterns: viewPatterns, approved: viewApproved }[state.sub]
    : { overview: viewOverview, teaching: viewTeaching, review: viewReview, agent: viewAgent, audit: viewAudit }[state.view];
  Promise.resolve(fn(root)).catch((e) => root.append(h("p", { class: "err", role: "alert", text: e.message })));
  window.scrollTo(0, 0);
}

// ---------------------------------------------------------------- small chart helpers
function tip(el, text) {
  const box = document.getElementById("tip");
  el.addEventListener("mousemove", (e) => {
    box.textContent = text; box.hidden = false;
    const w = box.offsetWidth, x = Math.min(window.innerWidth - w - 12, e.clientX + 14);
    box.style.left = Math.max(8, x) + "px"; box.style.top = (e.clientY + 16) + "px";
  });
  el.addEventListener("mouseleave", () => { box.hidden = true; });
  el.append(s("title", { text }));
}
function tile(label, value, note, opts) {
  const o = opts || {};
  const el = h(o.onclick ? "button" : "div", { class: "tile" + (o.accent ? " accent" : ""), type: o.onclick ? "button" : null, onclick: o.onclick },
    h("div", { class: "tile-label", text: label }), h("div", { class: "tile-value", text: value }),
    note ? h("div", { class: "tile-note", text: note }) : null);
  return el;
}
const num = (n) => Number(n || 0).toLocaleString("en");
const KIND_PLURAL = { quiz_item: "Quiz items", assignment: "Assignments", project: "Projects", observation: "Teacher notes", attendance: "Attendance records" };

function barRows(items, total) {
  const max = Math.max(1, ...items.map((i) => i.n));
  return h("div", { class: "hbars" }, items.map((i) => h("div", { class: "hbar" },
    h("span", { class: "hbar-label", text: i.label }),
    h("span", { class: "hbar-track" }, h("span", { class: "hbar-fill", style: "width:" + Math.max(1.5, (i.n / max) * 100) + "%" })),
    h("span", { class: "hbar-num", text: num(i.n) + (total ? "  (" + Math.round((i.n / total) * 100) + "%)" : "") }))));
}

function columnChart(points, label) {
  const W = 620, H = 210, L = 40, R = 8, T = 10, B = 28;
  const max = Math.max(1, ...points.map((p) => p.n));
  const top = Math.ceil(max / 50) * 50 || 50;
  const svg = s("svg", { viewBox: "0 0 " + W + " " + H, class: "chart", role: "img", "aria-label": label });
  for (const f of [0, 0.5, 1]) {
    const y = T + (H - T - B) * (1 - f);
    svg.append(s("line", { class: "grid", x1: L, x2: W - R, y1: y, y2: y }), s("text", { class: "axis", x: L - 6, y: y + 4, "text-anchor": "end", text: Math.round(top * f) }));
  }
  const step = (W - L - R) / Math.max(1, points.length), bw = Math.min(34, step - 4);
  points.forEach((p, i) => {
    const bh = (H - T - B) * (p.n / top), x = L + i * step + (step - bw) / 2, y = H - B - bh;
    const bar = s("path", { class: "bar", d: "M" + x + "," + (H - B) + " v" + (-(bh - 4)) + " q0,-4 4,-4 h" + (bw - 8) + " q4,0 4,4 v" + (bh - 4) + " z" });
    tip(bar, p.period + ": " + num(p.n) + " records");
    svg.append(bar);
    if (p.period.endsWith("T1")) svg.append(s("text", { class: "axis", x: x + bw / 2, y: H - 9, "text-anchor": "middle", text: p.period.slice(0, 4) }));
  });
  return svg;
}

const HEAT = ["#EAF1FE", "#C5D9FC", "#94B8F9", "#5C93F6", "#1B5BD6"];
function heatColour(mean) {
  const i = Math.max(0, Math.min(4, Math.floor((mean - 0.4) / 0.1)));
  return { bg: HEAT[i], ink: i >= 3 ? "#FFFFFF" : "#0A0A0A" };
}
function heatGrid(cov) {
  const multi = new Set(cov.strands.map((st) => st.subject)).size > 1;
  const table = h("table", { class: "heat" },
    h("thead", {}, h("tr", {}, h("th", { scope: "col", text: "Strand" }), cov.grades.map((g) => h("th", { scope: "col", text: "Grade " + g })))),
    h("tbody", {}, cov.strands.map((st) => h("tr", {}, h("th", { scope: "row" }, multi ? h("span", { class: "heat-subject", text: st.subject }) : null, h("span", { text: st.label })),
      st.cells.map((c) => {
        if (c.mean === null) return h("td", {}, h("span", { class: "heat-cell none", text: "no records" }));
        const col = heatColour(c.mean);
        const cellEl = h("span", { class: "heat-cell", style: "background:" + col.bg + ";color:" + col.ink, text: pct(c.mean) });
        tip(cellEl, st.label + ", grade " + c.grade + ": average " + pct(c.mean) + " over " + num(c.n) + " scored items");
        return h("td", {}, cellEl);
      })))));
  const key = h("div", { class: "heat-key small muted" }, h("span", { text: "Lower" }),
    HEAT.map((c) => h("span", { class: "heat-swatch", style: "background:" + c })), h("span", { text: "Higher average score" }));
  return h("div", {}, h("div", { class: "tablewrap plain" }, table), key);
}

function spark(strand, periods, th) {
  const W = 280, H = 118, L = 8, R = 40, T = 12, B = 20;
  const x = (p) => L + (periods.length < 2 ? 0 : (periods.indexOf(p) / (periods.length - 1)) * (W - L - R));
  const y = (m) => T + (1 - m) * (H - T - B);
  const svg = s("svg", { viewBox: "0 0 " + W + " " + H, class: "chart", role: "img", "aria-label": strand.label + " results by term" });
  svg.append(s("rect", { class: "band", x: L, y: y(1), width: W - L - R, height: y(th.strong_above) - y(1) }),
    s("line", { class: "grid", x1: L, x2: W - R, y1: y(th.strong_above), y2: y(th.strong_above) }),
    s("line", { class: "grid", x1: L, x2: W - R, y1: y(th.gap_below), y2: y(th.gap_below) }),
    s("line", { class: "base", x1: L, x2: W - R, y1: y(0), y2: y(0) }),
    s("text", { class: "axis", x: L, y: H - 5, text: periods[0].slice(0, 4) }),
    s("text", { class: "axis", x: W - R, y: H - 5, "text-anchor": "end", text: periods[periods.length - 1].slice(0, 4) }));
  const pts = strand.points;
  if (pts.length > 1) svg.append(s("path", { class: "line", d: pts.map((p, i) => (i ? "L" : "M") + x(p.period).toFixed(1) + "," + y(p.mean).toFixed(1)).join(" ") }));
  for (const p of pts) {
    const dot = s("circle", { class: "dot", cx: x(p.period), cy: y(p.mean), r: 4.5 });
    tip(dot, p.period + ": " + pct(p.mean) + " over " + p.n + " scored items");
    svg.append(dot);
  }
  const last = pts[pts.length - 1];
  svg.append(s("text", { class: "endlabel", x: Math.min(W - 4, x(last.period) + 9), y: y(last.mean) + 4, text: pct(last.mean) }));
  return h("div", { class: "spark" }, strand.subject ? h("div", { class: "spark-subject", text: strand.subject }) : null,
    h("div", { class: "spark-title", text: strand.label }), svg);
}

// ---------------------------------------------------------------- class overview
async function viewOverview(root) {
  root.append(h("p", { class: "muted", text: "Loading..." }));
  const [o, p] = await Promise.all([api("/api/overview"), api("/api/review/pending")]);
  await Promise.all([...new Set(p.findings.map((f) => f.learner_id))].slice(0, 6).map((id) => getGraph(id).catch(() => null)));
  const t = o.totals;
  clear(root);
  root.append(h("div", { class: "pagehead" },
    h("div", {}, h("h2", { text: "Class overview" }),
      h("p", { class: "muted", text: (o.curriculum ? o.curriculum.name + ". " : "") + "Learners appear by alias. All data in this demo is synthetic." })),
    h("button", { type: "button", class: "primary", onclick: () => show("agent") }, "Run the agent on a document")));

  root.append(h("div", { class: "tiles" },
    tile("Learners followed", num(t.learners), "by " + t.teachers + " teachers over the years"),
    tile("Records on file", num(t.records), "quiz items, notes, attendance"),
    tile("Curriculum covered", t.concepts_with_records + " of " + t.concepts_in_curriculum, "topics with at least one record"),
    tile("Waiting for a teacher", num(t.waiting), t.waiting ? "open the review queue" : "nothing to decide", { accent: t.waiting > 0, onclick: () => show("review") }),
    tile("Approved by teachers", num(t.approved), num(t.decisions) + " decisions recorded"),
    tile("Tool calls logged", num(t.tool_calls), num(t.refused_calls) + " refused by the server", { onclick: () => show("audit") })));

  // waiting for a decision

// ---------------------------------------------------------------- knowledge graph and teaching fit
const NODE_COLOUR = { subject: "#2871F4", strand: "#2871F4", skill: "#0E8F7E", teacher: "#8A4FD6", approach: "#C2417A" };
const NODE_WORD = { subject: "Subject", strand: "Curriculum strand", skill: "Thinking skill", teacher: "Teacher", approach: "Teaching approach" };

function knowledgeGraph(m) {
  const W = 900, H = 640, cx = W / 2, cy = H / 2, RX = 250, RY = 240;
  const many = (m.subjects || []).length > 1;
  const nodes = [
    ...(many ? m.subjects : []).map((x) => ({ type: "subject", label: x.label, sub: pct(x.mean), weight: x.n, tip: x.label + ": average " + pct(x.mean) + " over " + x.n + " scored items" })),
    ...(many ? [] : m.strands).map((x) => ({ type: "strand", label: x.label, sub: pct(x.mean), weight: x.n, tip: x.label + ": average " + pct(x.mean) + " over " + x.n + " scored items" })),
    ...m.skills.map((x) => ({ type: "skill", label: x.label, sub: pct(x.mean), weight: x.n, tip: x.label + ": average " + pct(x.mean) + " over " + x.n + " scored items" })),
    ...m.approaches.map((x) => ({ type: "approach", label: x.label, sub: x.improved + " of " + (x.improved + x.not_improved), weight: (x.improved + x.not_improved) * 6, tip: x.label + ": scores rose afterwards " + x.improved + " of " + (x.improved + x.not_improved) + " times" })),
    ...m.teachers.map((x) => ({ type: "teacher", label: x.name, sub: x.units + " units", weight: x.units * 6, tip: x.name + " taught this learner " + x.units + " units" })),
  ];
  const svg = s("svg", { viewBox: "0 0 " + W + " " + H, class: "chart kg", role: "img", "aria-label": "Knowledge graph for " + m.learner.alias });
  const edges = s("g", {}), dots = s("g", {});
  const maxW = Math.max(1, ...nodes.map((n) => n.weight));
  nodes.forEach((n, i) => {
    const a = -Math.PI / 2 + (i / nodes.length) * Math.PI * 2;
    const x = cx + Math.cos(a) * RX, y = cy + Math.sin(a) * RY;
    const r = 9 + 11 * Math.sqrt(n.weight / maxW);
    edges.append(s("path", { class: "kg-edge", stroke: NODE_COLOUR[n.type], "stroke-width": 1 + 3 * (n.weight / maxW),
      d: "M" + cx + "," + cy + " Q" + (cx + Math.cos(a) * RX * 0.45).toFixed(1) + "," + (cy + Math.sin(a) * RY * 0.2).toFixed(1) + " " + x.toFixed(1) + "," + y.toFixed(1) }));
    const g = s("g", { class: "kg-node" });
    g.append(s("circle", { cx: x, cy: y, r, fill: NODE_COLOUR[n.type] }));
    const side = Math.abs(Math.cos(a)) > 0.12, right = Math.cos(a) >= 0, below = Math.sin(a) > 0;
    const lx = side ? x + (right ? r + 8 : -(r + 8)) : x, anchor = side ? (right ? "start" : "end") : "middle";
    const ly = side ? y - 1 : (below ? y + r + 16 : y - r - 20);
    g.append(s("text", { class: "kg-label", x: lx, y: ly, "text-anchor": anchor, text: n.label }),
      s("text", { class: "kg-sub", x: lx, y: ly + 14, "text-anchor": anchor, text: n.sub }));
    tip(g, n.tip);
    dots.append(g);
  });
  svg.append(edges, dots,
    s("circle", { cx, cy, r: 46, class: "kg-centre" }),
    s("text", { class: "kg-centre-text", x: cx, y: cy + 7, "text-anchor": "middle", text: m.learner.alias.replace("Learner ", "") }));
  const present = [...new Set(nodes.map((n) => n.type))];
  const legend = h("ul", { class: "legend kg-legend", "aria-label": "Legend" }, present.map((t) => h("li", {}, h("span", { class: "kg-key", style: "background:" + NODE_COLOUR[t] }), h("span", { text: NODE_WORD[t] }))));
  return h("div", {}, legend, svg);
}

function skillBars(items) {
  return h("div", { class: "hbars" }, items.map((i) => h("div", { class: "hbar" },
    h("span", { class: "hbar-label", text: i.label }),
    h("span", { class: "hbar-track" }, h("span", { class: "hbar-fill", style: "width:" + Math.round(i.mean * 100) + "%" })),
    h("span", { class: "hbar-num", text: pct(i.mean) + " over " + i.n + " items" }))));
}

// ---------------------------------------------------------------- the map
const NODE_W = 138, NODE_H = 40, PITCH_X = 176, PITCH_Y = 56, LEFT = 128, TOP = 34, LANE_PAD = 10;

function wrap(text, max) {
  const words = text.split(/\s+/), lines = [];
  let cur = "";
  for (const w of words) {
    if ((cur + " " + w).trim().length <= max) cur = (cur + " " + w).trim();
    else { if (cur) lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  if (lines.length > 2) {
    lines.length = 2;
    lines[1] = lines[1].slice(0, max - 1).replace(/\s+\S*$/, "") + "…";
  }
  return lines;
}

function layout(g) {
  const concepts = g.nodes.filter((n) => n.type === "concept");
  const grades = [...new Set(concepts.map((n) => n.grade))].sort((a, b) => a - b);
  const strandNodes = g.nodes.filter((n) => n.type === "strand");
  const strands = strandNodes.map((n) => n.id).filter((sid) => concepts.some((c) => c.strand === sid));
  for (const c of concepts) if (!strands.includes(c.strand)) strands.push(c.strand);
  const cell = {};
  for (const c of concepts) {
    const k = c.strand + "|" + c.grade;
    (cell[k] = cell[k] || []).push(c);
  }
  const pos = {}, lanes = [];
  let y = TOP;
  for (const sid of strands) {
    let rows = 1;
    for (const gr of grades) rows = Math.max(rows, (cell[sid + "|" + gr] || []).length);
    const height = rows * PITCH_Y + LANE_PAD * 2;
    lanes.push({ id: sid, y, height, label: labelOf(sid) });
    for (const [gi, gr] of grades.entries()) {
      (cell[sid + "|" + gr] || []).forEach((c, ri) => {
        pos[c.id] = { x: LEFT + gi * PITCH_X, y: y + LANE_PAD + ri * PITCH_Y, col: gi };
      });
    }
    y += height;
  }
  return { grades, lanes, pos, width: LEFT + grades.length * PITCH_X, height: y + 8 };
}

function stateFor(g, cid) {
  const last = g.periods.length - 1;
  const node = g.byId[cid];
  if (state.periodIdx >= last || last < 0) return node.state;
  const m = (g.timeline[g.periods[state.periodIdx]] || {})[cid];
  if (m === undefined || m === null) return "unseen";
  if (m > g.thresholds.strong_above) return "strong";
  if (m < g.thresholds.gap_below) return "gap";
  return "shaky";
}

async function viewMap(root) {
  if (!state.learnerId) { root.append(h("p", { class: "empty", text: "No learners yet." })); return; }
  root.append(h("p", { class: "muted", text: "Loading the map..." }));
  let g = await getGraph(state.learnerId);
  const subjects = g.subjects || [];
  if (!state.subject || (state.subject !== "all" && !subjects.some((x) => x.id === state.subject))) state.subject = "all";
  if (subjects.length > 1 && state.subject !== "all") {
    const keep = (n) => n.type !== "concept" ? (n.type !== "strand" || g.strand_subject[n.id] === state.subject) : g.strand_subject[n.strand] === state.subject;
    const nodes = g.nodes.filter(keep), ids = new Set(nodes.map((n) => n.id));
    g = Object.assign({}, g, { nodes, edges: g.edges.filter((e) => ids.has(e.source) && ids.has(e.target)) });
  }
  g.byId = Object.fromEntries(g.nodes.map((n) => [n.id, n]));
  const lastIdx = g.periods.length - 1;
  state.periodIdx = Math.max(0, lastIdx);
  const L = layout(g);
  const concepts = g.nodes.filter((n) => n.type === "concept");

    legendItem("unseen", "No records yet (not the same as struggling)"));

  // svg
  const svg = s("svg", { id: "mapsvg", role: "group", "aria-label": "Curriculum map for " + g.learner.alias + ". Columns are grades, rows are strands.", width: L.width, height: L.height, viewBox: "0 0 " + L.width + " " + L.height });
  svg.append(s("defs", {},
    s("pattern", { id: "hatch", width: 8, height: 8, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" },
      s("rect", { width: 8, height: 8, fill: "#f9dcc8" }), s("rect", { width: 3, height: 8, fill: "#eeb08a" })),
    s("marker", { id: "arrow", viewBox: "0 0 8 8", refX: 7, refY: 4, markerWidth: 6, markerHeight: 6, orient: "auto" },
      s("path", { d: "M0,0 L8,4 L0,8 z", fill: "#59636b" }))));
  L.lanes.forEach((ln, i) => {
    svg.append(s("rect", { class: "lane-bg" + (i % 2 ? " alt" : ""), x: 0, y: ln.y, width: L.width, height: ln.height }));
    const lines = wrap(ln.label, 16);
    const t = s("text", { class: "lane-label", x: 8, y: ln.y + LANE_PAD + 16 });
    lines.forEach((ln2, k) => t.append(s("tspan", { x: 8, dy: k ? 15 : 0, text: ln2 })));
    svg.append(t);
  });
  L.grades.forEach((gr, gi) => svg.append(s("text", { class: "grade-label", x: LEFT + gi * PITCH_X + NODE_W / 2, y: 20, "text-anchor": "middle", text: "Grade " + gr })));

  const edgeEls = [];
  const edgeLayer = s("g", { id: "edges" });
  for (const e of reqEdges) {
    const a = L.pos[e.source], b = L.pos[e.target];
    let d;
    if (a.col === b.col) {
      const x = a.x, y1 = a.y + NODE_H / 2, y2 = b.y + NODE_H / 2;
      d = "M" + x + "," + y1 + " C" + (x - 34) + "," + y1 + " " + (x - 34) + "," + y2 + " " + (x - 2) + "," + y2;
    } else {
      const x1 = a.x + NODE_W, y1 = a.y + NODE_H / 2, x2 = b.x - 2, y2 = b.y + NODE_H / 2;
      const dx = Math.max(30, (x2 - x1) / 2);

    }

  }
  svg.append(edgeLayer);

  const nodeEls = {};
  for (const c of concepts) {
    const p = L.pos[c.id];

    grp.append(s("rect", { class: "ring sel", x: -4, y: -4, width: NODE_W + 8, height: NODE_H + 8, rx: 11 }));
    grp.append(s("rect", { class: "ring path", x: -3, y: -3, width: NODE_W + 6, height: NODE_H + 6, rx: 10 }));

    grp.append(s("path", { class: "m-shaky", d: "M13,14 a6,6 0 0 1 0,12 z" }));
    grp.append(s("path", { class: "m-gap", d: "M13,14 l6,12 h-12 z" }));

    grp.append(t);
    grp.append(s("text", { class: "tag root", x: 0, y: -4, text: "START POINT TO CHECK" }));
    grp.append(s("text", { class: "tag unk", x: NODE_W - 4, y: -4, "text-anchor": "end", text: "no records" }));
    grp.addEventListener("click", () => selectNode(c.id));
    grp.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); selectNode(c.id); } });
    svg.append(grp);
    nodeEls[c.id] = grp;
  }

  const detail = h("aside", { id: "detail", class: "card", "aria-live": "polite", "aria-label": "Concept details" });
  const rangeId = "term-range";
  const slider = h("input", { type: "range", id: rangeId, min: 0, max: Math.max(0, lastIdx), step: 1, value: state.periodIdx, disabled: lastIdx < 1 });
  const periodLabel = h("span", { class: "small", id: "period-label" });
  const playBtn = h("button", { type: "button", "aria-pressed": "false", disabled: lastIdx < 1 }, "Play");

  function paint() {
    const tracing = !!state.trace;
    svg.classList.toggle("tracing", tracing);
    const onPath = new Set(tracing ? state.trace.path : []);
    const unknown = new Set(tracing ? state.trace.unknowns : []);
    const rootId = tracing && state.trace.root ? state.trace.root.concept_id : null;
    for (const c of concepts) {
      const el = nodeEls[c.id];
      if (!el) continue;
      const st = stateFor(g, c.id);
      el.setAttribute("class", "node s-" + st + (state.sel === c.id ? " selected" : "") + (onPath.has(c.id) ? " on-path" : "") + (c.id === rootId ? " is-root" : "") + (unknown.has(c.id) ? " is-unknown" : ""));
      el.setAttribute("aria-label", c.label + ", grade " + c.grade + ". " + STATE_WORDS[st] + (c.id === rootId ? ". Possible starting point." : "") + (unknown.has(c.id) ? ". No records." : ""));

    const pathPairs = new Set();
    if (tracing) for (let i = 0; i + 1 < state.trace.path.length; i++) pathPairs.add(state.trace.path[i + 1] + ">" + state.trace.path[i]);
    for (const e of edgeEls) {
      const tp = pathPairs.has(e.source + ">" + e.target);
      const hl = !tracing && state.sel && (e.source === state.sel || e.target === state.sel);
      e.el.setAttribute("class", "edge" + (tp ? " tp" : "") + (hl ? " hl" : ""));
    }
    const per = g.periods[state.periodIdx];
    periodLabel.textContent = lastIdx < 0 ? "No dated records yet" : (state.periodIdx >= lastIdx ? "All records up to " + per : "Records up to " + per);
    slider.value = state.periodIdx;
    slider.setAttribute("aria-valuetext", periodLabel.textContent);
  }

  function selectNode(cid) {
    if (state.sel !== cid) state.trace = null;
    state.sel = cid;
    paint();
    drawDetail(detail, g, cid, paint);
  }

  slider.addEventListener("input", () => { state.periodIdx = Number(slider.value); paint(); });
  playBtn.addEventListener("click", () => {
    if (state.timer) { clearInterval(state.timer); state.timer = null; playBtn.textContent = "Play"; playBtn.setAttribute("aria-pressed", "false"); return; }
    if (state.periodIdx >= lastIdx) state.periodIdx = 0;
    playBtn.textContent = "Pause"; playBtn.setAttribute("aria-pressed", "true");
    paint();
    state.timer = setInterval(() => {
      if (state.periodIdx >= lastIdx) { clearInterval(state.timer); state.timer = null; playBtn.textContent = "Play"; playBtn.setAttribute("aria-pressed", "false"); return; }
      state.periodIdx += 1; paint();
    }, 900);
  });

  clear(root);
  root.append(
    h("div", { class: "map-top" },
      h("div", {}, h("h2", { text: g.learner.alias }),
        subjects.length > 1 ? h("div", { class: "row", style: "margin:8px 0" }, h("label", { for: "subject-pick", text: "Subject" }),
          (() => { const pick = h("select", { id: "subject-pick" }, [{ id: "all", label: "All subjects" }, ...subjects].map((x) => h("option", { value: x.id, selected: x.id === state.subject, text: x.label })));
            pick.addEventListener("change", () => { state.subject = pick.value; state.sel = null; state.trace = null; show("learner/map"); }); return pick; })()) : null,
        h("div", { class: "small muted", text: "Home language: " + langName(g.learner.home_language) + ". Columns are grades; rows are strands; a line means “needs this first”." })),
      legend),
    h("div", { class: "replay card" },
      h("label", { for: rangeId, text: "Term" }), slider, periodLabel, playBtn,
      h("span", { class: "small muted", text: "Replay shows what the records had shown by each term." })),
    h("div", { class: "map-cols" },
      h("div", { class: "mapbox", tabindex: 0, role: "region", "aria-label": "Scrollable curriculum map" }, svg),
      detail));
  paint();

  else clear(detail).append(h("h3", { text: "Select a concept" }), h("p", { class: "muted", text: "Click or press Enter on any box to see this learner's records for it and to trace where a difficulty may have started." }));
}

function legendSwatch(st) {
  const svg = s("svg", { width: 30, height: 20, "aria-hidden": "true" });
  const g = s("g", { class: "node s-" + st });
  g.append(s("rect", { class: "body", x: 1, y: 1, width: 28, height: 18, rx: 5 }));
  if (st === "strong") g.append(s("circle", { class: "m-strong", cx: 15, cy: 10, r: 4.5 }));
  if (st === "shaky") g.append(s("path", { class: "m-shaky", d: "M15,5 a5,5 0 0 1 0,10 z" }));
  if (st === "gap") g.append(s("path", { class: "m-gap", d: "M15,4.5 l5,10 h-10 z" }));
  if (st === "unseen") g.append(s("circle", { class: "m-unseen", cx: 15, cy: 10, r: 4.5 }));
  svg.append(g);
  return svg;
}

async function drawDetail(panel, g, cid, repaint) {
  const n = g.byId[cid];
  const stNow = n.state;
  clear(panel);
  const needs = g.edges.filter((e) => e.type === "requires" && e.target === cid).map((e) => e.source);
  const leads = g.edges.filter((e) => e.type === "requires" && e.source === cid).map((e) => e.target);
  const linkList = (ids) => ids.length
    ? h("ul", { style: "margin:4px 0 0;padding-left:18px" }, ids.map((id) => h("li", {}, h("button", { type: "button", class: "linkbtn", style: "border:none;background:none;padding:0;min-height:0;color:#1f5f99;text-decoration:underline", onclick: () => { state.trace = null; state.sel = id; repaint(); drawDetail(panel, g, id, repaint); document.querySelector('[data-id="' + id + '"]').scrollIntoView({ block: "nearest", inline: "nearest" }); } }, labelOf(id) + " (grade " + (g.byId[id] ? g.byId[id].grade : "?") + ")"))))
    : h("p", { class: "muted small", text: "None in this curriculum." });
  const traceBox = h("div", { class: "stack" });
  const evBox = h("div", {}, h("p", { class: "muted", text: "Loading records..." }));
  panel.append(
    h("h3", { text: n.label }),
    h("p", { class: "small muted", text: "Grade " + n.grade + ", " + labelOf(n.strand) }),
    h("p", {}, h("strong", { text: STATE_WORDS[stNow] }),
      n.n ? h("span", { class: "muted", text: ". Average score " + pct(n.mastery) + " over " + n.n + " scored item" + (n.n === 1 ? "" : "s") + "." })
          : h("span", { class: "muted", text: ". No scored records for this learner. That means nothing has been recorded, not that the learner is struggling." })),
    h("div", { class: "row" }, h("button", { type: "button", class: "primary", onclick: () => doTrace(traceBox, g, cid, repaint) }, "Trace back"),
      state.trace ? h("button", { type: "button", onclick: () => { state.trace = null; clear(traceBox); repaint(); } }, "Clear trace") : null),
    traceBox,
    h("h3", { style: "margin-top:14px", text: "Needs this first" }), linkList(needs),
    h("h3", { style: "margin-top:10px", text: "Leads to" }), linkList(leads),
    h("h3", { style: "margin-top:14px", text: "Records for this concept" }), evBox);
  if (state.trace && state.trace.target.concept_id === cid) renderTrace(traceBox, g, state.trace);
  try {
    const tl = await api("/api/learners/" + encodeURIComponent(state.learnerId) + "/timeline?concept_id=" + encodeURIComponent(cid));
    const rows = tl.periods.flatMap((p) => p.items);
    clear(evBox).append(rows.length ? evidenceTable(rows) : h("p", { class: "muted", text: "No records for this concept." }));
  } catch (e) { clear(evBox).append(h("p", { class: "err", text: e.message })); }
}

async function doTrace(box, g, cid, repaint) {
  clear(box).append(h("p", { class: "muted", text: "Tracing..." }));
  try {
    const t = await api("/api/learners/" + encodeURIComponent(state.learnerId) + "/trace/" + encodeURIComponent(cid));
    state.trace = t;
    repaint();
    drawDetail(document.getElementById("detail"), g, cid, repaint);
  } catch (e) { clear(box).append(h("p", { class: "err", role: "alert", text: e.message })); }
}

function renderTrace(box, g, t) {
  clear(box);
  const evBox = h("div");
  const parts = [];
  parts.push(h("h3", { text: "Where this may have started" }));
  parts.push(h("p", { text: t.reason }));
  parts.push(h("p", { class: "small", text: confWords(t.confidence) + (t.confidence !== undefined ? " (" + pct(t.confidence) + ")" : "") + ". This is a pattern to check against what you know, not a conclusion about the learner." }));
  if (t.root) {
    parts.push(h("dl", { class: "kv" },
      h("dt", { text: "Possible start" }), h("dd", { text: t.root.label + " (grade " + t.root.grade + ")" }),
      h("dt", { text: "First seen" }), h("dd", { text: t.root.period }),
      h("dt", { text: "Average" }), h("dd", { text: pct(t.root.mean) + " over " + t.root.n + " items" })));
  } else {
    parts.push(h("p", { class: "muted", text: "No clear starting point was found in the records." }));
  }
  if (t.path && t.path.length > 1) {
    parts.push(h("p", { class: "small" }, h("strong", { text: "Path: " }), t.path.map((id) => labelOf(id)).join("  → needs →  ")));
  }
  if (t.context && t.context.length) {
    parts.push(h("div", {}, h("strong", { text: "Absences around that time" }),
      h("ul", { style: "margin:4px 0;padding-left:18px" }, t.context.map((c) => h("li", { text: c.absent_days + " day(s) absent in " + c.period + " (record " + c.evidence_id + ")" })))));
  }
  if (t.unknowns && t.unknowns.length) {
    parts.push(h("div", {}, h("strong", { text: "No records for these concepts (not guessed)" }),
      h("ul", { style: "margin:4px 0;padding-left:18px" }, t.unknowns.map((id) => h("li", { text: labelOf(id) })))));
  }
  if (t.alternatives && t.alternatives.length) {
    parts.push(h("p", { class: "small", text: "Other possible starting points: " + t.alternatives.map((a) => a.label).join(", ") + "." }));
  }
  parts.push(h("details", {}, h("summary", { text: "Show the " + (t.evidence_ids || []).length + " records behind this" }),
    h("div", { "data-lazy": "1" }, "")));
  box.append(h("div", { class: "card stack", style: "background:#fbf6f1" }, parts));
  const det = box.querySelector("details");
  det.addEventListener("toggle", async () => {
    const holder = det.querySelector("[data-lazy]");
    if (!det.open || holder.dataset.done) return;
    holder.dataset.done = "1";
    clear(holder).append(h("p", { class: "muted", text: "Loading..." }));
    try {
      const r = await api("/api/evidence?ids=" + (t.evidence_ids || []).join(","));
      clear(holder).append(evidenceTable(r.evidence));
    } catch (e) { clear(holder).append(h("p", { class: "err", text: e.message })); }
  });
}

// ---------------------------------------------------------------- patterns
async function viewPatterns(root) {
  if (!state.learnerId) return;
  const lid = encodeURIComponent(state.learnerId);
  await getGraph(state.learnerId);
  const [pat, ww] = await Promise.all([api("/api/learners/" + lid + "/patterns"), api("/api/learners/" + lid + "/what-worked")]);
  clear(root);
  root.append(h("h2", { text: "Patterns for " + aliasOf(state.learnerId) }),
    h("p", { class: "muted", text: "These are patterns the records show over several terms. They are things to check, not labels. Nothing here is a decision until you approve it in the Review queue." }));
  const list = h("div");
  if (!pat.patterns.length) list.append(h("p", { class: "empty", text: "No pattern has held for long enough yet." }));
  for (const p of pat.patterns) {
    const card = h("div", { class: "card" },
      h("div", { class: "row" }, h("span", { class: "pill", text: p.kind === "strength" ? "Strength pattern" : "Struggle pattern" }),
        h("strong", { text: p.label }), h("span", { class: "muted small", text: "(" + p.scope + ")" })),
      h("p", { text: (p.kind === "strength" ? "Scores stayed high" : "Scores stayed low") + " in " + p.periods.join(", ") + ": average " + pct(p.mean) + " over " + p.n_items + " items. " + confWords(p.confidence) + "." }));
    const det = h("details", {}, h("summary", { text: "Show the " + p.evidence_ids.length + " records" }), h("div", {}));
    let done = false;
    det.addEventListener("toggle", async () => {
      if (!det.open || done) return;
      done = true;
      try { const r = await api("/api/evidence?ids=" + p.evidence_ids.join(",")); det.lastChild.append(evidenceTable(r.evidence)); }
      catch (e) { det.lastChild.append(h("p", { class: "err", text: e.message })); }
    });
    card.append(det);
    list.append(card);
  }
  root.append(list);
  if (pat.data_gaps && pat.data_gaps.length) {
    root.append(h("div", { class: "card" }, h("h3", { text: "Gaps in the records" }),
      h("ul", {}, pat.data_gaps.map((d) => h("li", { text: d.period + ": " + d.reason })))));
  }
  const wwBox = h("div", { class: "card" }, h("h3", { text: "What seems to have helped this learner" }), h("p", { class: "small muted", text: ww.note }));
  if (!ww.approaches.length) wwBox.append(h("p", { class: "muted", text: "Not enough before-and-after records yet." }));
  for (const a of ww.approaches) {
    wwBox.append(h("div", { class: "stack", style: "margin-top:8px" },
      h("strong", { text: a.label }),
      h("div", { class: "small", text: "Scores rose after " + a.improved + " time(s) and did not rise after " + a.not_improved + ". Average change " + (a.mean_gain >= 0 ? "+" : "") + Math.round(a.mean_gain * 100) + " points." }),
      h("ul", { class: "small", style: "margin:0;padding-left:18px" }, a.instances.map((i) => h("li", { text: labelOf(i.concept_id) + ", " + i.period + ": " + pct(i.before) + " before, " + pct(i.after) + " after" })))));
  }
  root.append(wwBox);
}

// ---------------------------------------------------------------- review queue
async function viewReview(root) {
  const p = await api("/api/review/pending");
  state.pendingCount = p.findings.length + p.summaries.length;
  drawTabs();
  const lids = [...new Set([...p.findings.map((f) => f.learner_id), ...p.summaries.map((x) => x.learner_id)])];
  await Promise.all(lids.map((id) => getGraph(id).catch(() => null)));
  clear(root);
  root.append(h("h2", { text: "Review queue" }),
    h("p", { class: "muted", text: "Proposals wait here until a named teacher decides. Choose your name in the side panel first. Approving, editing or rejecting is recorded with your name." }));
  if (!p.findings.length && !p.summaries.length) root.append(h("p", { class: "empty card", text: "Nothing is waiting for review." }));
  if (p.findings.length) root.append(h("h3", { class: "section-title", text: "Proposed findings (" + p.findings.length + ")" }));

// ---------------------------------------------------------------- approved
// What a named teacher has already approved for this learner: the findings, and the notes built from them.
async function viewApproved(root) {

// ---------------------------------------------------------------- agent

  clear(root);
  root.append(h("h2", { text: "Agent" }),
    h("p", { class: "muted", text: "The agent reads a document, checks the map and proposes findings. It cannot approve anything: it stops and waits for a teacher." }));

  const fileSel = h("select", { id: "inbox-file" }, h("option", { value: "", text: "No file: use the records already stored" }), files.map((f) => h("option", { value: f.name, text: f.name })));
  const learnerSel = h("select", { id: "run-learner" }, state.learners.map((l) => h("option", { value: l.learner_id, text: l.alias })));
  learnerSel.value = state.learnerId;
  const msg = h("div", { "aria-live": "polite" });
  const go = h("button", { type: "button", class: "primary" }, "Start a run");
  go.addEventListener("click", async () => {
    go.disabled = true; clear(msg);
    try {
      const r = await post("/api/runs", { learner_id: learnerSel.value, inbox_file: fileSel.value || null });
      state.runId = r.run_id;

    } catch (e) { msg.append(h("span", { class: "err", role: "alert", text: e.message })); }
    go.disabled = false;
  });
  root.append(h("div", { class: "card" }, h("div", { class: "row" },
    h("div", {}, h("label", { for: "inbox-file", text: "Document from the inbox" }), h("br"), fileSel),
    h("div", {}, h("label", { for: "run-learner", text: "Learner" }), h("br"), learnerSel),
    h("div", {}, h("br"), go)), msg), out, h("h3", { style: "margin:16px 0 6px", text: "Earlier runs" }), runsBox);
  await loadRuns(runsBox, out);

async function loadRuns(box, out) {
  try {
    const r = await api("/api/runs");
    clear(box);
    if (!r.runs.length) { box.append(h("p", { class: "muted", text: "No runs yet." })); return; }
    box.append(h("div", { class: "tablewrap" }, h("table", {},
      h("thead", {}, h("tr", {}, ["Started", "Learner", "Status", ""].map((t) => h("th", { scope: "col", text: t })))),
      h("tbody", {}, r.runs.slice(0, 15).map((run) => h("tr", {},
        h("td", { text: run.started_at ? new Date(run.started_at).toLocaleString() : "" }),
        h("td", { text: aliasOf((run.task || {}).learner_id) }),
        h("td", { class: "status-" + run.status, text: statusWords(run.status) }),
        h("td", {}, h("button", { type: "button", onclick: () => { state.runId = run.run_id; pollRun(out, box); } }, "Open"))))))));
  } catch (e) { clear(box).append(h("p", { class: e.status === 503 ? "muted" : "err", text: e.message })); }

const statusWords = (st) => ({ running: "Running", waiting_for_teacher: "Waiting for a teacher", done: "Done", failed: "Failed" }[st] || st);

function pollRun(out, runsBox) {
  if (state.runTimer) clearInterval(state.runTimer);
  const tick = async () => {
    if (!document.body.contains(out)) { clearInterval(state.runTimer); state.runTimer = null; return; }
    try {
      const r = await api("/api/runs/" + encodeURIComponent(state.runId));
      renderRun(out, r);
      if (r.status === "done" || r.status === "failed") { clearInterval(state.runTimer); state.runTimer = null; loadRuns(runsBox, out); refreshPending(); }
    } catch (e) { clear(out).append(h("p", { class: "err", role: "alert", text: e.message })); clearInterval(state.runTimer); state.runTimer = null; }
  };
  tick();
  state.runTimer = setInterval(tick, 2000);
}

function renderRun(out, r) {
  clear(out);
  const u = r.usage || {};
  const usageText = Object.keys(u).length
    ? [u.calls !== undefined ? u.calls + " model calls" : null, u.input_tokens !== undefined ? u.input_tokens + " tokens in" : null, u.output_tokens !== undefined ? u.output_tokens + " tokens out" : null, u.seconds !== undefined ? u.seconds + " s of model time" : null].filter(Boolean).join(", ")
    : "not recorded yet";
  const card = h("div", { class: "card stack", "aria-live": "polite" },
    h("div", { class: "row" }, h("strong", { text: "Run " + r.run_id }), h("span", { class: "status-" + r.status, text: statusWords(r.status) }),
      r.task ? h("span", { class: "muted", text: aliasOf(r.task.learner_id) + (r.task.inbox_file ? ", file " + String(r.task.inbox_file).split(/[\\/]/).pop() : "") }) : null),
    h("dl", { class: "kv" }, h("dt", { text: "Model" }), h("dd", { text: r.model || "not recorded" }), h("dt", { text: "Usage" }), h("dd", { text: usageText })));
  if (r.status === "waiting_for_teacher") {
    card.append(h("p", {}, h("strong", { text: "Waiting for a teacher. " }), h("a", { href: "#review", onclick: (ev) => { ev.preventDefault(); show("review"); } }, "Open the review queue"),
      " to approve, edit or reject what the agent proposed. The run continues once you decide."));
  }
  if (r.error) card.append(h("p", { class: "err", role: "alert", text: "The run stopped: " + r.error }));
  card.append(h("h3", { text: "Steps" }));
  card.append((r.steps || []).length
    ? h("ol", { class: "steps" }, r.steps.map((st) => h("li", {}, h("strong", { text: st.node }), " ", h("span", { class: st.ok === false ? "err" : "muted", text: (st.ok === false ? "failed. " : "") + (st.note || "") }))))
    : h("p", { class: "muted", text: "No steps yet." }));
  const oq = r.open_questions || [];
  if (oq.length) {
    card.append(h("h3", { text: "Questions the agent left open instead of guessing" }),
      h("ul", {}, oq.map((q) => h("li", { text: typeof q === "string" ? q : JSON.stringify(q) }))));
  }
  const ids = (r.finding_ids || []).length;
  if (ids || (r.summary_ids || []).length) card.append(h("p", { class: "small muted", text: "Proposed " + ids + " finding(s) and " + (r.summary_ids || []).length + " summary draft(s)." }));
  out.append(card);
}

// ---------------------------------------------------------------- audit
async function viewAudit(root) {
  clear(root);
  root.append(h("h2", { text: "Audit log" }),
    h("p", { class: "muted", text: "Every tool call anyone made, and every decision with the teacher's name." }));
  const tool = h("input", { type: "text", id: "audit-tool", placeholder: "e.g. propose_finding" });
  const limit = h("select", { id: "audit-limit" }, [50, 100, 300].map((n) => h("option", { value: n, text: "Latest " + n })));
  const table = h("div"), appr = h("div");
  async function load() {
    const q = "?limit=" + limit.value + (tool.value.trim() ? "&tool=" + encodeURIComponent(tool.value.trim()) : "");
    const r = await api("/api/audit" + q);

        h("strong", { text: "Input" }), h("pre", { text: pretty(e.input) }), h("strong", { text: "Output" }), h("pre", { text: pretty(e.output) })));
      const btn = h("button", { type: "button", "aria-expanded": "false", onclick: () => { detail.hidden = !detail.hidden; btn.setAttribute("aria-expanded", String(!detail.hidden)); btn.textContent = detail.hidden ? "Show" : "Hide"; } }, "Show");
      tb.append(h("tr", {}, h("td", { text: new Date(e.ts).toLocaleString() }), h("td", { text: e.actor }), h("td", { text: e.tool }),
        h("td", { class: e.ok ? "okmsg" : "err", text: e.ok ? "ok" : "failed" }), h("td", { text: e.duration_ms + " ms" }), h("td", {}, btn)), detail);
    }

  }

    h("div", {}, h("label", { for: "audit-limit", text: "How many" }), h("br"), limit),
    h("div", {}, h("br"), h("button", { type: "button", onclick: () => load().catch((e) => clear(table).append(h("p", { class: "err", text: e.message }))) }, "Apply")));
  root.append(filter, table, h("h3", { style: "margin:18px 0 6px", text: "Decisions by teachers" }), appr);
  const a = await api("/api/approvals");
  if (!a.approvals.length) appr.append(h("p", { class: "muted", text: "No decisions yet." }));
  else appr.append(h("div", { class: "tablewrap" }, h("table", {},
    h("thead", {}, h("tr", {}, ["Time", "Teacher", "Decision", "On", "Note"].map((t) => h("th", { scope: "col", text: t })))),
    h("tbody", {}, a.approvals.map((x) => h("tr", {}, h("td", { text: new Date(x.ts).toLocaleString() }), h("td", { text: x.teacher_name }),
      h("td", { text: x.decision }), h("td", { text: x.target_type + " " + x.target_id }), h("td", { text: x.note || "" })))))));

}
